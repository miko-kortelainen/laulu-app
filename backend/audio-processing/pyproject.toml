[project]
name = "musical-copilot-audio-processing"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["melband-roformer-infer==0.1.5", "audio-separator[cpu]==0.47.0", "audioread>=3.1,<4"]

[tool.uv]
# audio-separator pins 0.1.0, which needs a system libsamplerate. 0.2.4 bundles it.
override-dependencies = ["samplerate==0.2.4"]
