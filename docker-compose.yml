services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3001"
    volumes:
      - song-recovery:/app/backend/generated-music
    init: true
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  song-recovery:
