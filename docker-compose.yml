services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL:?}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:?}
    environment:
      NODE_ENV: production
      PORT: "3001"
      LANGSMITH_TRACING: "false"
      SUPABASE_URL: ${SUPABASE_URL:?}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?}
      CF_AI_GATEWAY_ACCOUNT_ID: ${CF_AI_GATEWAY_ACCOUNT_ID:?}
      CF_AI_GATEWAY_ID: ${CF_AI_GATEWAY_ID:?}
      CF_AI_GATEWAY_TOKEN: ${CF_AI_GATEWAY_TOKEN:?}
      CF_AI_GATEWAY_NEBIUS_SLUG: ${CF_AI_GATEWAY_NEBIUS_SLUG:-nebius}
      CF_AI_GATEWAY_QWENCLOUD_SLUG: ${CF_AI_GATEWAY_QWENCLOUD_SLUG:-qwencloud}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      NEBIUS_MODEL: ${NEBIUS_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      LYRICS_MODEL: ${LYRICS_MODEL:-zai-org/GLM-5.3-Flash}
      QUOTA_CHAT_DAILY: ${QUOTA_CHAT_DAILY:-20}
      QUOTA_ANALYSIS_DAILY: ${QUOTA_ANALYSIS_DAILY:-10}
      QUOTA_GENERATION_DAILY: ${QUOTA_GENERATION_DAILY:-5}
      QUOTA_STORAGE_BYTES: ${QUOTA_STORAGE_BYTES:-536870912}
      GLOBAL_CHAT_DAILY: ${GLOBAL_CHAT_DAILY:?}
      GLOBAL_ANALYSIS_DAILY: ${GLOBAL_ANALYSIS_DAILY:?}
      GLOBAL_GENERATION_DAILY: ${GLOBAL_GENERATION_DAILY:?}
      MAX_GENERATED_SONG_BYTES: ${MAX_GENERATED_SONG_BYTES:-26214400}
      MAX_AUDIO_JOBS: ${MAX_AUDIO_JOBS:-2}
      ALLOWED_ORIGINS: https://studio.lau.lu
    expose:
      - "3001"
    volumes:
      - song-recovery:/app/backend/generated-music
    init: true
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  song-recovery:
